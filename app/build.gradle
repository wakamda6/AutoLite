import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autolite'
    compileSdk 33

    defaultConfig {
        applicationId "com.autolite"
        minSdk 24
        targetSdk 33
        versionCode 210
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(project.hasProperty('KEYSTORE_FILE') ? project.KEYSTORE_FILE : "")
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.KEYSTORE_PASSWORD : ""
            keyAlias project.hasProperty('KEY_ALIAS') ? project.KEY_ALIAS : ""
            keyPassword project.hasProperty('KEY_PASSWORD') ? project.KEY_PASSWORD : ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def buildType = variant.buildType.name
            if (buildType == "release") {
                outputFileName = "AutoLite" + getBuildDate() + "_" + defaultConfig.versionName + "_release.apk"
            }else if (buildType == "debug") {
                outputFileName = "AutoLite" + getBuildDate() + "_" + defaultConfig.versionName + "_debug.apk"
            }
        }
    }
}

static def getBuildDate() {
    def dateFormat = new java.text.SimpleDateFormat("yyyyMMdd_HH_mm", Locale.CHINA)
    return dateFormat.format(new Date())
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    //mqtt库
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.hannesa2:paho.mqtt.android:3.3.5'
    //扫码开源库
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    //协程
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"  // Or the latest version
    //viewmodel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.activity:activity-ktx:1.7.2"
    implementation "androidx.fragment:fragment-ktx:1.5.7"
}